<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TTR Valladolid">
<meta name="description" content="Match times, courts, clubs and stats for the Castilla y León TOP TTR Valladolid Absoluto-Sénior: your matches, your friends, your country, and how far behind schedule each venue is running.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F7A58'/%3E%3Ccircle cx='32' cy='22' r='9' fill='%23fff'/%3E%3Cpath d='M20 54 L32 30 L44 54 Z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F7A58'/%3E%3Ccircle cx='32' cy='22' r='9' fill='%23fff'/%3E%3Cpath d='M20 54 L32 30 L44 54 Z' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<title>TTR Valladolid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface2:#E9EDE8; --ink:#16212A; --ink2:#5E6B74; --ink3:#8B979F;
  --line:#D8DED9; --accent:#1F7A58; --accent-soft:#DDEFE6; --accent-ink:#0F4D36;
  --live:#D6453A; --live-soft:#FBE4E1; --warn:#B9730B; --warn-soft:#FBEBD0;
  --vA:#2B62D9; --vA-soft:#DDE7FB; --vB:#D9781F; --vB-soft:#FBE8D6; --vC:#7E4FD6; --vC-soft:#EAE1FB;
  --hl:#FFF3C4; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418; --surface:#161E24; --surface2:#1E2930; --ink:#E7ECEA; --ink2:#A2AEB5; --ink3:#73808A;
    --line:#2A363E; --accent:#43B282; --accent-soft:#183A2C; --accent-ink:#B8EBD1;
    --live:#FF6F63; --live-soft:#45211E; --warn:#F0A83A; --warn-soft:#3E2E12;
    --vA:#7FA6FF; --vA-soft:#1D2C4D; --vB:#F3A45B; --vB-soft:#43301A; --vC:#B79BFF; --vC-soft:#31264D;
    --hl:#4A3E14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161E24; --surface2:#1E2930; --ink:#E7ECEA; --ink2:#A2AEB5; --ink3:#73808A;
  --line:#2A363E; --accent:#43B282; --accent-soft:#183A2C; --accent-ink:#B8EBD1;
  --live:#FF6F63; --live-soft:#45211E; --warn:#F0A83A; --warn-soft:#3E2E12;
  --vA:#7FA6FF; --vA-soft:#1D2C4D; --vB:#F3A45B; --vB-soft:#43301A; --vC:#B79BFF; --vC-soft:#31264D;
  --hl:#4A3E14; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{margin:0;font:700 21px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}
.brand small{color:var(--ink2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.dot.ok{background:var(--accent)} .dot.err{background:var(--live)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg,.dot.busy,.livedot{animation:none}}

/* main */
main{max-width:760px;margin:0 auto;padding:12px 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:var(--warn-soft);color:var(--ink);border:1px solid transparent}
.banner.err{background:var(--live-soft)}
.banner.info{background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font:700 20px/1.1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
h3{font:600 15px/1.2 "Barlow",system-ui,sans-serif;margin:0 0 6px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

/* search */
.search{position:relative}
.sres{margin-top:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 40px 12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--ink3)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--ink2);font-size:18px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.list > *{border-top:1px solid var(--line)} .list > :first-child{border-top:0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.prow:active{background:var(--surface2)}
.prow .nm{font-weight:600}
.prow .sub{font-size:12px;color:var(--ink2)}
.flag{font-size:18px;line-height:1;width:24px;text-align:center;flex:0 0 auto}
.cc{font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--ink2);background:var(--surface2);border-radius:4px;padding:2px 3px;line-height:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:500;opacity:.7;font-size:12px}
.cgrid{display:flex;flex-wrap:wrap;gap:8px}
.cgrid .chip{padding:8px 12px 8px 9px}
.chip.day{flex-direction:column;gap:0;padding:6px 12px;line-height:1.05;min-width:56px}
.chip.day b{font:700 16px/1 "Barlow Condensed",system-ui,sans-serif}
.chip.day span{font-size:11px;font-weight:500;opacity:.75}
.chip.day.nodata{opacity:.45}

/* match cards */
.dayhead{display:flex;align-items:baseline;gap:8px;margin:16px 0 6px}
.dayhead h2{margin:0}
.dayhead .muted{font-size:13px}
.match{display:grid;grid-template-columns:minmax(66px,auto) 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);position:relative}
.match.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.match.past{opacity:.72}
.match.bye{opacity:.6}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.when .t{font:700 24px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.2px}
.when .est{font-size:12px;color:var(--warn);font-weight:600;line-height:1.1}
.when .est.ok{color:var(--ink3);font-weight:500}
.vchip{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:3px 6px;font:700 12px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.vchip .lt{font-size:15px}
.when .vchip{padding:4px 9px;border-radius:9px;gap:6px;margin-top:2px}
.when .vchip .lt{font-size:24px;line-height:1}
.when .vchip span:not(.lt){font-size:13px}
.v-A{background:var(--vA-soft);color:var(--vA)} .v-B{background:var(--vB-soft);color:var(--vB)} .v-C{background:var(--vC-soft);color:var(--vC)} .v-{background:var(--surface2);color:var(--ink2)}
.court{font-size:12px;color:var(--ink2);font-weight:600}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ev{font:600 13px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.pill{margin-left:auto;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.warm{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--surface2);color:var(--ink2)}
.pill.bye,.pill.tbd{background:var(--surface2);color:var(--ink2)}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
.team{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:3px 0}
.team .names{min-width:0;font-weight:500;line-height:1.25}
.team .names .p{display:inline}
.team .names .sep{color:var(--ink3);margin:0 3px}
.team.win .names{font-weight:700}
.team.lose .names{color:var(--ink2)}
.team .names .me{background:var(--hl);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.team .pflag{font-size:14px;margin-right:1px}
.team .seed{font-size:11px;color:var(--ink3);font-weight:600;margin-left:3px}
.sets{display:flex;gap:6px;font:600 15px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);min-width:0}
.sets span{width:20px;text-align:right;font-variant-numeric:tabular-nums}
.team.win .sets span{color:var(--ink)}
.sets span.cur{color:var(--live);font-weight:700}
.vs{position:absolute;left:78px;font-size:10px;color:var(--ink3);letter-spacing:.5px}
.mfoot{display:flex;gap:10px;margin-top:4px;font-size:12px;color:var(--ink2)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--live);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:6px 0}
.nowline::before,.nowline::after{content:"";flex:1;height:1px;background:var(--live);opacity:.5}

/* hero for me */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#2a9a6f 100%);color:#fff;border-radius:16px;padding:18px 16px}
.hero h2{color:#fff;margin:0 0 4px;font-size:24px}
.hero p{margin:0 0 12px;opacity:.92}
.hero .search input{border-color:transparent}
.mehead{display:flex;align-items:center;gap:12px}
.mehead .big{font:700 26px/1 "Barlow Condensed",system-ui,sans-serif}
.mehead .flag{font-size:30px;width:36px}
.next{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.next b{font-weight:700}

/* bracket */
.rchips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:5;background:var(--bg);padding-top:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.bracket{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:4px -16px 0;padding:6px 16px 10px;scrollbar-width:none}
.bracket::-webkit-scrollbar{display:none}
.bcol{flex:0 0 min(80vw,330px);scroll-snap-align:start;padding:0 14px;box-sizing:border-box}
.bcol.first{padding-left:0}
.bslots{display:flex;flex-direction:column}
.bslot{flex:1;position:relative;display:flex;align-items:center;min-height:0}
.bcol:not(.first) .bslot::before{content:"";position:absolute;left:-28px;width:14px;top:25%;bottom:25%;border:1.5px solid var(--line);border-left:0;border-radius:0 8px 8px 0}
.bcol:not(.first) .bslot::after{content:"";position:absolute;left:-14px;width:14px;top:50%;border-top:1.5px solid var(--line)}
.bbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 8px 6px;box-shadow:var(--shadow);position:relative;z-index:1}
.bbox.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.bbox.live{border-color:var(--live)}
.bbox.bye,.bbox.tbd{opacity:.6;box-shadow:none;border-style:dashed}
.bmeta{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.2px;text-transform:uppercase;margin-bottom:2px;min-height:13px}
.bmeta .lv{color:var(--live)} .bmeta .wu{color:var(--warn)} .bmeta .mn{font-weight:500;text-transform:none}
.bteam{display:grid;grid-template-columns:18px 1fr auto;gap:5px;align-items:center;font-size:13px;line-height:1.25;padding:1px 0}
.bteam .bflag{font-size:13px;line-height:1;width:18px;text-align:center}
.bteam .bflag .cc{font-size:9px;padding:1px 2px}
.bteam .bn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bteam.win .bn{font-weight:700} .bteam.lose .bn{color:var(--ink2)}
.bteam.me .bn{background:var(--hl);border-radius:3px;padding:0 3px}
.bteam .seed{font-size:10px;color:var(--ink3);font-weight:600}
.bteam .bs{display:flex;gap:4px;font:600 12.5px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);font-variant-numeric:tabular-nums}
.bteam .bs span{min-width:15px;text-align:right}
.bteam.win .bs{color:var(--ink)}
/* venues */
.vcard{border-left:5px solid var(--line)}
.vcard.v-A{border-left-color:var(--vA);background:var(--surface);color:var(--ink)}
.vcard.v-B{border-left-color:var(--vB);background:var(--surface);color:var(--ink)}
.vcard.v-C{border-left-color:var(--vC);background:var(--surface);color:var(--ink)}
.vtitle{display:flex;align-items:baseline;gap:8px}
.vtitle .lt{font:700 28px/1 "Barlow Condensed",system-ui,sans-serif}
.vtitle .nm{font-weight:600}
.delay{margin:8px 0 10px;font:600 15px/1.2 "Barlow",system-ui,sans-serif}
.delay .big{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;margin-right:4px}
.delay.ok .big{color:var(--accent)} .delay.late .big{color:var(--warn)} .delay.bad .big{color:var(--live)}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ct{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;min-height:64px;background:var(--bg)}
.ct .cn{font:700 13px/1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);display:flex;justify-content:space-between;margin-bottom:5px}
.ct .cn .st{color:var(--live)} .ct .cn .st.warm{color:var(--warn)} .ct .cn .st.free{color:var(--ink3)}
.ct .who{font-weight:600;line-height:1.2;font-size:13px}
.ct .who.dim{font-weight:500;color:var(--ink2)}
.ct .sc{font:600 13px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);margin-top:4px}

/* venue: court pills and on-court list */
.courtrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.cpill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;font:700 13px/1 "Barlow Condensed",system-ui,sans-serif;background:var(--surface2);color:var(--ink3);border:1px dashed var(--line)}
.cpill.live{background:var(--live-soft);color:var(--live);border-style:solid;border-color:transparent}
.cpill.warm{background:var(--warn-soft);color:var(--warn);border-style:solid;border-color:transparent}
.cpill.fin{background:var(--surface2);color:var(--ink2);border-style:solid;border-color:transparent}
.onlist{display:flex;flex-direction:column}
.onrow{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.onrow:first-child{border-top:0}
.cbadge{display:inline-flex;align-items:center;justify-content:center;height:28px;border-radius:7px;background:var(--live-soft);color:var(--live);font:700 13px/1 "Barlow Condensed",system-ui,sans-serif}
.cbadge.q{background:var(--surface2);color:var(--ink3);border:1px dashed var(--line)}
.onrow .sc{font:600 14px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink2);margin-left:6px;white-space:nowrap}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--tab-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:10px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;padding:0 2px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--ink2)}
.foot{margin-top:28px;font-size:12px;color:var(--ink3);line-height:1.5}
.madeby{margin-top:26px;text-align:center;font-size:13px;color:var(--ink2);line-height:1.6}
.lnk{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:40;box-shadow:var(--shadow)}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:370px){.tab{font-size:9px;letter-spacing:0}.tab svg{width:20px;height:20px}}

/* stats */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

<script>

  if(FLAGS_OK!==null) return FLAGS_OK;

    const c=document.createElement('canvas'); const x=c.getContext('2d'); x.font='24px system-ui, sans-serif';

function flagEmoji(cc){
  if(SUBFLAG[cc]) return SUBFLAG[cc];

  return String.fromCodePoint(...[...iso].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));

  if(!cc||CLUBS) return '';

function cname(cc){ return CLUBS[cc]||NAMES[cc]||cc||'—'; }

/* ---------- storage ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(CFG.storage+':'+k); return v==null?d:JSON.parse(v);}catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(CFG.storage+':'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(CFG.storage+':'+k);}catch(e){} }

/* ---------- time helpers (all wall-clock, tournament local time) ---------- */
function romeNow(){ // 'YYYY-MM-DD HH:MM'
  try{ return new Date().toLocaleString('sv-SE',{timeZone:CFG.tz,hour12:false}).slice(0,16).replace('T',' '); }
  catch(e){ const d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
}
function p2(n){ return (n<10?'0':'')+n; }
function keyMin(s){ // 'YYYY-MM-DD HH:MM' -> minutes
  return Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10), +s.slice(11,13), +s.slice(14,16))/60000;
}
function minToHM(min){ const d=new Date(min*60000); return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()); }
function dayLabel(d, style){ // d 'YYYY-MM-DD'
  const dt=new Date(d+'T12:00:00Z'); const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];

  return wd+' '+dt.getUTCDate()+' '+mon;

function fmtClock(ts){ const d=new Date(ts); return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }

/* ---------- normalisation for search ---------- */
const XLAT = {'ø':'o','æ':'ae','å':'a','ß':'ss','ð':'d','þ':'th','ł':'l','đ':'d','œ':'oe','ı':'i'};

function fixName(s){ return (s||'').split(' ').map(w=>{ if(w===w.toUpperCase()) return w; return w.replace(/([^\x00-\x7F])([A-Z])/g,(m,a,b)=>a+b.toLowerCase()); }).join(' '); }

/* ---------- data ---------- */
const D = { days:{}, players:new Map(), countries:new Map(), loading:0, lastOk:0, lastErr:null, drawList:null, draws:{}, drawBusy:{}, byCode:new Map() };
function compact(raw, date){
  const out=[];
  for(const m of raw){
    const team=t=>(t&&t.players||[]).map(p=>({i:String(p.id), n:fixName(p.nameDisplay||((p.firstName||'')+' '+(p.lastName||'')).trim()), c:p.countryCode||t.countryCode||''}));

let DJ=null; // one request for data.json per refresh, shared by all days
async function fetchDay(date){

function today(){ return romeNow().slice(0,10); }

  const day=D.days[date]; if(!day) return true; if(force) return true;
  const age=Date.now()-day.at; const td=today();
  if(date===td) return age>30000;
  if(date<td) return age>CFG.pastMs || !day.m.length;

async function load(opts){
  opts=opts||{};
  const dates=CFG.days.filter(d=>needsFetch(d,opts.force));
  if(!dates.length){ return; }
  D.loading++; setDot('busy'); updBtn(true);
  let anyErr=null;
  await Promise.all(dates.map(async date=>{
    try{ const m=await fetchDay(date); D.days[date]={at:Date.now(),m}; store.set('day:'+date,D.days[date]); D.lastOk=Date.now(); }
    catch(e){ anyErr=e; if(!D.days[date]){ const c=store.get('day:'+date); if(c) D.days[date]=c; } }
  }));
  D.loading--; D.lastErr=anyErr; rebuildIndex();
  setDot(anyErr?'err':'ok'); updBtn(false); render({bg:true});
}

/* delay estimate per venue, from today's matches */
function venueDelays(){
  const td=today(), nowM=keyMin(romeNow()); const day=D.days[td]; const res={};
  for(const v in CFG.venues){
    const ms=day?day.m.filter(m=>m.v===v&&!m.bye):[];
    const on=ms.filter(m=>m.st==='P'||m.st==='W');
    const ds=on.map(m=>(nowM-(m.du||0))-keyMin(m.t)).sort((a,b)=>a-b);
    let est=null, kind='none', basis=0;
    if(ds.length){ est=ds[Math.floor(ds.length/2)]; kind='live'; basis=ds.length; }
    const overdue=ms.filter(m=>m.st==='N'&&keyMin(m.t)<nowM);
    if(overdue.length){
      const bound=nowM-Math.max(...overdue.map(m=>keyMin(m.t))); // conservative lower bound
      if(est==null){ est=bound; kind='bound'; basis=overdue.length; }
      else if(bound>est){ est=bound; kind='bound+'; }
    }
    const fin=ms.filter(m=>m.st==='F'||m.st==='O').length, tot=ms.length;
    const lastSched=ms.length?Math.max(...ms.map(m=>keyMin(m.t))):null;
    const started=ms.length&&ms.every(m=>m.st!=='N');
    res[v]={est:est==null?null:Math.round(est), kind, basis, fin, tot, on:on.length, done:started&&tot>0&&fin===tot, lastSched};
  }
  return res;
}
function delayText(d){
  if(!d||d.est==null){ if(d&&d.done) return {cls:'ok',big:'Done',txt:'All matches in this venue are finished for today.'}; return {cls:'ok',big:'—',txt:'No live matches right now.'}; }
  const e=d.est;
  const basis=d.kind==='live'||d.kind==='bound+'?d.basis+' match'+(d.basis===1?'':'es')+' on court':'no match has started since its scheduled time';
  if(e<=5&&e>=-10) return {cls:'ok',big:'On time',txt:'Running to schedule (based on '+basis+').'};
  if(e<-10) return {cls:'ok',big:Math.abs(e)+' min',txt:'ahead of schedule (based on '+basis+').'};
  const cls=e>=45?'bad':'late';
  const pre=d.kind==='bound'?'at least ':'about ';
  return {cls,big:pre+e+' min',txt:'behind schedule (based on '+basis+').'};
}

  if(m.st==='O') return {k:'done',label:'Finished'};
  if(m.st==='F') return {k:'done',label:m.ss==='Walkover'?'Walkover':m.ss==='Retired'?'Retired':m.ss&&m.ss!=='Normal'?m.ss:'Finished'};
  if(m.tbd) return {k:'tbd',label:(m.a.length||m.b.length)?'Opponent TBD':'Players TBD'};
  if(m.d===ctx.td && keyMin(m.t)<ctx.nowM-5) return {k:'late',label:'Delayed'};
  return {k:'sched',label:''};
}

function listWithNow(ms, ctx, opt){

function searchResults(q, opt){
  const nq=norm(q); if(nq.length<2) return '';
  const toks=nq.split(' ');
  const hits=[];
  for(const p of D.players.values()){
    const words=p.k.split(' ');
    const ok=toks.every(t=>words.some(w=>w.startsWith(t)));
    if(ok){ hits.push(p); }
  }
  hits.sort((a,b)=>{ const ea=a.k===nq?0:1, eb=b.k===nq?0:1; if(ea!==eb) return ea-eb; return a.n.split(' ').pop().localeCompare(b.n.split(' ').pop())||a.n.localeCompare(b.n); });
  if(!hits.length) return '<div class="empty">No player found for “'+esc(q)+'”. Try the surname only, as written in the draw. Players whose first match is not scheduled yet cannot be found.</div>';
  return '<div class="list">'+hits.slice(0,25).map(p=>'<button class="prow" data-act="'+(opt.act||'open')+'" data-id="'+p.i+'"><span class="flag">'+flag(p.c)+'</span><div class="grow"><div class="nm">'+esc(p.n)+'</div><div class="sub">'+esc(cname(p.c))+' · '+[...p.ev].join(', ')+'</div>'+tagsHtml(p.i,true)+'</div>'+(isFollowed(p.i)?'<span class="tiny muted">★</span>':'')+'</button>').join('')+(hits.length>25?'<div class="empty small">'+(hits.length-25)+' more, keep typing…</div>':'')+'</div>';
}

/* ---------- stats: worked out on the phone from the day feeds that are already loaded ---------- */
// Counted: finished matches with both sides and a score. Walkovers are left out. A retired match counts for the players'
// totals but not for the match records (longest, shortest). In doubles both partners get the minutes and points.
const MEDAL_ROUNDS={SF:'SF', Final:'Final', F:'Final'};
const CATS=['IM','IF','DM','DF','DX'];
const CAT_NAMES={IM:"Men's singles",IF:"Women's singles",DM:"Men's doubles",DF:"Women's doubles",DX:'Mixed doubles'};
const TROPHY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3"/></svg>';
const BOARDS=[
  {k:'min', t:'Minutes on court', tag:'Most minutes on court', u:'min'},
  {k:'mt', t:'Matches played', tag:'Most matches played', u:''},
  {k:'w', t:'Wins', tag:'Most wins', u:''},
  {k:'pts', t:'Points played', tag:'Most points played', u:''},
  {k:'g3', t:'Three-game matches', tag:'Most three-game matches', u:''}
];
function ageOf(ev){ const m=/\s([A-Z]\d?)$/.exec(ev||''); return m?m[1]:'Absoluto'; } // the level: A1, B2, D ...
function isPlayed(m){ return (m.st==='F'||m.st==='O')&&!m.bye&&m.a.length>0&&m.b.length>0&&m.sc.length>0&&m.ss!=='Walkover'; }
function isClean(m){ return isPlayed(m)&&m.ss==='Normal'&&m.du>0; }
function ptsOf(m){ let s=0; for(const g of m.sc) s+=(+g[0]||0)+(+g[1]||0); return s; }
function surname(n){ const w=(n||'').split(' '); const up=w.filter(x=>x.length>1&&x===x.toUpperCase()&&x!==x.toLowerCase()); return up.length?up.join(' '):w[w.length-1]; }
function fmtN(n){ return Math.round(n).toLocaleString('en-GB'); }
function ordinal(n){ if(!n) return '–'; const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function scoreTxt(m){ return m.sc.map(g=>g[0]+'-'+g[1]).join('  '); }
function kpi(v,l,s){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }
let SC={ver:-1, map:{}};
function stats(age){ // cached until the day data changes
  if(SC.ver!==D.ver) SC={ver:D.ver, map:{}};
  const k=String(age||''); if(!SC.map[k]) SC.map[k]=computeStats(age||'');
  return SC.map[k];
}
function computeStats(age){
  const P=new Map(), C=new Map(), AG=new Map(); const played=[]; let min=0, points=0;
  const all=allMatches();
  for(const m of all){
    if(age&&ageOf(m.ev)!==age) continue;
    if(!isPlayed(m)) continue;
    played.push(m);
    const tp=ptsOf(m), du=m.du>0?m.du:0; min+=du; points+=tp;
    const g3=m.sc.length>=3;
    [m.a,m.b].forEach((side,s)=>{
      const won=m.w===s+1, lost=m.w===2-s;
      let pw=0, gw=0, gl=0; for(const g of m.sc){ const x=+g[s]||0, y=+g[1-s]||0; pw+=x; if(x>y) gw++; else if(y>x) gl++; }
      for(const p of side){
        let e=P.get(p.i); if(!e){ e={i:p.i,n:p.n,c:p.c,mt:0,w:0,l:0,min:0,pts:0,pw:0,gw:0,gl:0,g3:0,long:0,ev:new Set()}; P.set(p.i,e); }
        e.mt++; if(won) e.w++; if(lost) e.l++; e.min+=du; e.pts+=tp; e.pw+=pw; e.gw+=gw; e.gl+=gl; if(g3) e.g3++; if(du>e.long) e.long=du; e.ev.add(m.ev);
      }
      const opp=new Set((s?m.a:m.b).map(p=>p.c)); // a country on both sides (Dane v Dane) wins and loses nothing
      for(const c of new Set(side.map(p=>p.c).filter(Boolean))){
        let e=C.get(c); if(!e){ e={c,w:0,l:0,mt:0,same:0,min:0,pl:new Set()}; C.set(c,e); }
        if(opp.has(c)){ if(s===0) e.same++; } else { e.mt++; if(won) e.w++; if(lost) e.l++; }
        e.min+=du; side.forEach(p=>{ if(p.c===c) e.pl.add(p.i); });
      }
    });
    const a=ageOf(m.ev); let g=AG.get(a); if(!g){ g={age:a,n:0,dn:0,min:0,pts:0,g3:0}; AG.set(a,g); }
    g.n++; if(g3) g.g3++; if(du>0){ g.dn++; g.min+=du; g.pts+=tp; }
  }
  const players=[...P.values()];
  const boards={}, rank={};
  for(const b of BOARDS){
    const arr=players.filter(p=>p[b.k]>0).sort((x,y)=>y[b.k]-x[b.k]||y.min-x.min||x.n.localeCompare(y.n));
    boards[b.k]=arr;
    const r=new Map(); let prev=null, pos=0; arr.forEach((p,i)=>{ if(p[b.k]!==prev){ pos=i+1; prev=p[b.k]; } r.set(p.i,pos); }); rank[b.k]=r; // 1 + players with a higher value
  }
  const clean=played.filter(isClean);
  const longest=clean.slice().sort((x,y)=>y.du-x.du||ptsOf(y)-ptsOf(x)).slice(0,5);
  const shortest=clean.slice().sort((x,y)=>x.du-y.du||ptsOf(x)-ptsOf(y)).slice(0,3);
  const games=[]; for(const m of clean){ m.sc.forEach((g,i)=>{ const x=+g[0]||0, y=+g[1]||0; games.push({m,g,i,t:x+y,lo:Math.min(x,y),hi:Math.max(x,y)}); }); }
  const highGames=games.filter(x=>x.hi>21).sort((x,y)=>y.t-x.t).slice(0,5);
  const comebacks=clean.filter(m=>m.sc.length===3&&((+m.sc[0][0]>+m.sc[0][1])?2:1)===m.w).length;
  const three=clean.filter(m=>m.sc.length===3).length;
  const seedN=s=>{ const n=parseInt(s,10); return isNaN(n)?99:n; };
  const seeded=played.filter(m=>m.sa||m.sb);
  const upsets=seeded.filter(m=>(m.w===1&&!m.sa&&m.sb)||(m.w===2&&!m.sb&&m.sa)).sort((x,y)=>seedN(x.w===1?x.sb:x.sa)-seedN(y.w===1?y.sb:y.sa)||(x.t<y.t?1:-1));
  const countries=[...C.values()].sort((x,y)=>y.w-x.w||(y.w/(y.mt||1))-(x.w/(x.mt||1))||x.c.localeCompare(y.c));
  const crank=new Map(); { let prev=null,pos=0; countries.forEach((c,i)=>{ if(c.w!==prev){ pos=i+1; prev=c.w; } crank.set(c.c,pos); }); }
  const ages=[...AG.values()].sort((x,y)=>lvlCmp(x.age,y.age));
  // medals: both semifinal losers get bronze, the final gives gold and silver (walkovers count here)
  const medals=new Map(), pmedals=new Map();
  for(const m of all){
    if(age&&ageOf(m.ev)!==age) continue;
    const rd=MEDAL_ROUNDS[m.rd]; if(!rd) continue;
    if(!(m.st==='F'||m.st==='O')||!m.a.length||!m.b.length||!(m.w===1||m.w===2)) continue;
    const win=m.w===1?m.a:m.b, lose=m.w===1?m.b:m.a;
    const give=(side,kind)=>{ for(const c of new Set(side.map(p=>p.c).filter(Boolean))){ const e=medals.get(c)||{c,g:0,s:0,b:0}; e[kind]++; medals.set(c,e); } for(const p of side){ const l=pmedals.get(p.i)||[]; l.push({kind,ev:m.ev}); pmedals.set(p.i,l); } };
    if(rd==='SF') give(lose,'b'); else { give(win,'g'); give(lose,'s'); }
  }
  const medalTable=[...medals.values()].sort((x,y)=>y.g-x.g||y.s-x.s||y.b-x.b||x.c.localeCompare(y.c));
  // medals per player: gold 4 points, silver 2, bronze 1; equal points are split by golds, then silvers
  const pmedalList=[...pmedals.entries()].map(([pid,l])=>{ const p=P.get(pid)||D.players.get(pid)||{i:pid,n:'',c:''}; const o={i:pid,n:p.n,c:p.c,g:0,s:0,b:0,l}; l.forEach(x=>o[x.kind]++); o.pts=4*o.g+2*o.s+o.b; return o; })
    .sort((x,y)=>y.pts-x.pts||y.g-x.g||y.s-x.s||x.n.localeCompare(y.n));
  { let prev=null,pos=0; pmedalList.forEach((o,i)=>{ const k=o.pts+'/'+o.g+'/'+o.s; if(k!==prev){ pos=i+1; prev=k; } o.rk=pos; }); }
  // final four and final two: every player in a semifinal or final (scheduled or played), per event; won marks a side that won it
  const byRound=rd=>{ const M=new Map();
    for(const m of all){
      if(MEDAL_ROUNDS[m.rd]!==rd) continue; if(age&&ageOf(m.ev)!==age) continue;
      const e=M.get(m.ev)||{ev:m.ev,sides:[],won:[]}; const done=m.st==='F'||m.st==='O';
      [m.a,m.b].forEach((t,s)=>{ if(t.length){ e.sides.push(t); e.won.push(done&&m.w===s+1); } }); M.set(m.ev,e);
    }
    return [...M.values()].sort((x,y)=>lvlCmp(ageOf(x.ev),ageOf(y.ev))||CATS.indexOf(x.ev.slice(0,2))-CATS.indexOf(y.ev.slice(0,2))); };
  const final4=byRound('SF'), final2=byRound('Final');
  // tags: players who lead a board (only when five or fewer share the top spot), record holders and medal winners
  const tags=new Map(); const addTag=(pid,t,v)=>{ const l=tags.get(pid)||[]; if(!l.some(x=>x.t===t)) l.push({t,v}); tags.set(pid,l); };
  if(!age){
    for(const [pid,l] of pmedals) for(const x of l) addTag(pid,({g:'Gold',s:'Silver',b:'Bronze'})[x.kind]+' · '+x.ev,'');
    for(const b of BOARDS){ const arr=boards[b.k]; if(!arr.length) continue; const top=arr[0][b.k]; const lead=arr.filter(p=>p[b.k]===top); if(lead.length<=5) lead.forEach(p=>addTag(p.i,b.tag,fmtN(top)+(b.u?' '+b.u:''))); }
    if(longest[0]){ const d=longest[0].du; clean.filter(m=>m.du===d).slice(0,3).forEach(m=>m.a.concat(m.b).forEach(p=>addTag(p.i,'Longest match',d+' min'))); }
    if(highGames[0]){ const t=highGames[0].t; highGames.filter(x=>x.t===t).slice(0,3).forEach(x=>x.m.a.concat(x.m.b).forEach(p=>addTag(p.i,'Highest-scoring game',x.hi+'-'+x.lo))); }
  }
  return {age, played, players, P, boards, rank, min, points, countriesN:C.size, C, countries, crank, ages, longest, shortest, highGames, comebacks, three, clean:clean.length, upsets, seeded:seeded.length, medalTable, pmedalList, final4, final2, tags};
}
function factHtml(){ // one fun fact from the Stats tab, picked once per visit; tapping it opens Stats
  const st=stats(0); if(!st.played.length) return '';
  const F=[], lead=(arr,v)=>arr.length&&(arr.length<2||v(arr[0])>v(arr[1])); // only when there is a single leader
  const bm=st.boards.min; if(lead(bm,p=>p.min)) F.push('<b>'+esc(bm[0].n)+'</b> has spent the most time on court so far: <b>'+fmtN(bm[0].min)+' min</b>.');
  const L=st.longest[0]; if(L) F.push('The longest match so far lasted <b>'+L.du+' min</b> ('+esc(L.ev)+' '+esc(L.rd)+').');
  const H=st.highGames[0]; if(H) F.push('The highest-scoring game so far ended <b>'+H.hi+'-'+H.lo+'</b> ('+esc(H.m.ev)+').');
  if(st.comebacks>1) F.push('<b>'+fmtN(st.comebacks)+' matches</b> have been won after losing the first game.');
  F.push('<b>'+fmtN(st.played.length)+' matches</b> and <b>'+fmtN(st.min/60)+' hours</b> of badminton played so far.');
  for(const [list,what] of [[st.final2,'finals'],[st.final4,'semifinals']]){ if(!list.length) continue; const C=new Map(); for(const e of list) for(const t of e.sides) for(const p of t) if(p.c) C.set(p.c,(C.get(p.c)||0)+1);
    const r=[...C.entries()].sort((x,y)=>y[1]-x[1]); if(lead(r,x=>x[1])) F.push('<b>'+esc(cname(r[0][0]))+'</b> has the most players in the '+what+': <b>'+r[0][1]+'</b>.'); }
  const M=st.medalTable; if(M.length&&M[0].g&&lead(M,x=>x.g)) F.push('<b>'+esc(cname(M[0].c))+'</b> leads the medal table with <b>'+M[0].g+' gold</b>.');
  return '<button class="fact" data-act="tab" data-tab="stats"><span class="fi">'+TROPHY+'</span><span class="grow"><span class="fl">Did you know?</span>'+F[S.factI%F.length]+'</span><span class="muted">›</span></button>';
}
function tagsHtml(pid, small){
  const l=stats(0).tags.get(pid); if(!l||!l.length) return '';
  return '<div class="tags">'+l.map(x=>'<span class="tag'+(small?' sm':'')+'"'+(x.v?' title="'+esc(x.v)+'"':'')+'>'+TROPHY+esc(x.t)+'</span>').join('')+'</div>';
}

/* longest run of points, from BWF's match statistics: one small request per finished match, only for the player on screen */
const MST_API='https://extranet-lv.bwfbadminton.com/api/match-center/vue-match-stat?tmtId='+CFG.tmtId+'&matchId=';
const MST={}, MSTbusy={}; let mstTimer=null;
function matchRun(m){ // [run of side a, run of side b]; undefined while loading; null when BWF has no numbers
  const k=m.n; if(!k) return null;
  return null;
  if(k in MST) return MST[k];
  const c=store.get('mst:'+k); if(Array.isArray(c)){ MST[k]=c; return c; }
  if(!MSTbusy[k]){
    MSTbusy[k]=fetch(MST_API+encodeURIComponent(k),{cache:'default'}).then(r=>r.ok?r.json():null).then(j=>{
      const r=j&&j.results;
      if(r&&r.team1_consecutive_points!=null){
        let v=[+r.team1_consecutive_points||0,+r.team2_consecutive_points||0];
        const pa=m.sc.reduce((x,g)=>x+(+g[0]||0),0), pb=m.sc.reduce((x,g)=>x+(+g[1]||0),0);
        if(pa!==pb&&+r.team1_rallies_won===pb&&+r.team2_rallies_won===pa) v=[v[1],v[0]]; // safety: BWF's team 1 turned out to be our side b
        MST[k]=v; store.set('mst:'+k,v);
      } else MST[k]=null;
    }).catch(()=>{ MST[k]=null; }).then(()=>{ delete MSTbusy[k]; clearTimeout(mstTimer); mstTimer=setTimeout(()=>render({bg:true}),250); });
  }
  return undefined;
}

function playerStatsCard(p){ // the player's own numbers, on the Me page and on every player page
  const st=stats(0); const e=st.P.get(p.i); if(!e) return '';
  let run=0, pending=0, known=0;
  for(const m of matchesOf(p.i)){ if(!isPlayed(m)) continue; const r=matchRun(m); if(r===undefined){ pending++; continue; } if(!r) continue; known++; const s=m.a.some(x=>x.i===p.i)?0:1; if(r[s]>run) run=r[s]; }
  const rk=k=>{ const r=st.rank[k].get(p.i); return r?'#'+fmtN(r)+' of '+fmtN(st.players.length):''; };
  return '<div class="card" style="margin-top:10px"><div class="shead"><span class="ev">Tournament so far</span><button class="btn ghost" data-act="tab" data-tab="stats" style="padding:0">All stats ›</button></div><div class="kpis">'+
    kpi(e.w+'–'+e.l,'Won–lost',e.mt+' match'+(e.mt===1?'':'es'))+
    kpi(fmtN(e.min)+'<small>min</small>','On court',rk('min'))+
    kpi(fmtN(e.pts),'Points played',fmtN(e.pw)+' won')+
    kpi(e.gw+'–'+e.gl,'Games won–lost',e.g3?e.g3+' went to three':'')+
    kpi(e.long+'<small>min</small>','Longest match','')+
    
  '</div></div>';
}

function medalHtml(st){

const MEDAL_EMOJI={g:'\u{1F947}',s:'\u{1F948}',b:'\u{1F949}'}, MEDAL_WORD={g:'Gold',s:'Silver',b:'Bronze'};
function rankRows(arr,key){ let prev=null,pos=0; return arr.map((o,i)=>{ const k=key(o); if(k!==prev){ pos=i+1; prev=k; } return pos; }); }
function moreBtn(k,total,few,label){ return total>few?'<button class="btn ghost more" data-act="smore" data-k="'+k+'">'+(S.smore[k]?'Show top '+few:'Show all '+total+(label?' '+label:''))+'</button>':''; }
function pmedalHtml(st){ // medals per player, gold counts most
  const l=st.pmedalList; if(!l.length) return '';
  const shown=l.slice(0,S.smore.pm?l.length:10);
  const mine=S.me&&!shown.some(o=>o.i===S.me.i)?l.find(o=>o.i===S.me.i):null;

}
function f4Flags(t){ return t.map(p=>'<span class="flag" title="'+esc(cname(p.c))+'">'+(flag(p.c)||'')+'</span>').join(''); }
function roundHtml(st,k){ // which countries have the most players in the finals (f2) or the semifinals (f4)

  const evs=list.filter(e=>!cat||e.ev===cat||e.ev.startsWith(cat+' '));
  const C=new Map();
  for(const e of evs) for(const t of e.sides) for(const p of t){ if(!p.c) continue; const o=C.get(p.c)||{c:p.c,n:0,ev:new Set()}; o.n++; o.ev.add(e.ev); C.set(p.c,o); }
  const rows=[...C.values()].sort((x,y)=>y.n-x.n||y.ev.size-x.ev.size||cname(x.c).localeCompare(cname(y.c)));
  const rk=rankRows(rows,o=>o.n);
  const nR=S.smore[k]?rows.length:10;

  let html='<h2>'+(f2?'Final two':'Final four')+'</h2><div class="card"><p class="small" style="margin:0 0 8px">Players in the '+(f2?'finals':'semifinals')+', counted per club'+(st.age?' in the '+ageLbl(st.age)+' events':'')+'.</p>';
  if(cats.length>1) html+='<div class="chips" style="padding-bottom:10px">'+[''].concat(cats).map(c=>'<button class="chip'+(c===cat?' on':'')+'" data-act="scat" data-k="'+k+'" data-c="'+c+'">'+(c||'All')+'</button>').join('')+'</div>';
  html+='<table class="stbl"><thead><tr><th>Club</th><th>Players</th><th>Events</th></tr></thead><tbody>'+rows.slice(0,nR).map((o,i)=>'<tr class="tap'+(S.me&&S.me.c===o.c?' hi':'')+'" data-act="opencountry" data-cc="'+esc(o.c)+'"><td><span class="cn">'+rk[i]+'. <span class="flag" style="width:auto;font-size:15px">'+(flag(o.c)||'')+'</span>'+esc(cname(o.c))+'</span></td><td>'+o.n+'</td><td>'+o.ev.size+'</td></tr>').join('')+'</tbody></table>'+moreBtn(k,rows.length,10,'countries');
  const kev=k+'ev', open=S.smore[kev]||evs.length<=6;
  html+='<div class="ev" style="margin:14px 0 4px">'+(cat?esc(CAT_NAMES[cat]):'Each event')+' · '+evs.length+' event'+(evs.length===1?'':'s')+'</div>';
  if(open) html+='<div class="f4list">'+evs.map(e=>{ const dr=drawFor(e.ev); const inner='<span class="f4ev">'+esc(e.ev)+'</span><span class="f4s">'+e.sides.map((t,i)=>'<span class="f4side">'+(f2&&e.won[i]?'<span class="mdl">'+MEDAL_EMOJI.g+'</span>':'')+f4Flags(t)+'</span>').join('')+'</span>'+(dr?'<span class="muted">›</span>':''); return dr?'<button class="f4row" data-act="draw" data-id="'+dr.id+'" data-pid="'+esc(me)+'" data-from="stats">'+inner+'</button>':'<div class="f4row">'+inner+'</div>'; }).join('')+'</div>';
  if(evs.length>6) html+='<button class="btn ghost more" data-act="smore" data-k="'+kev+'">'+(S.smore[kev]?'Hide the events':'Show the '+evs.length+' events')+'</button>';
  return html+'<p class="tiny muted" style="margin:8px 0 0">A doubles pair counts as two players.'+(f2?' '+MEDAL_EMOJI.g+' marks the winners once a final has been played.':'')+' Tap an event to open its draw.</p></div>';
}
function partHtml(st){ // participants per country: players who have played at least one match
  const C=new Map(); for(const p of st.players){ if(p.c) C.set(p.c,(C.get(p.c)||0)+1); }
  const rows=[...C.entries()].sort((x,y)=>y[1]-x[1]||cname(x[0]).localeCompare(cname(y[0])));
  if(!rows.length) return '';
  const rk=rankRows(rows,r=>r[1]); const top=rows[0][1]; const nR=S.smore.part?rows.length:10;
  return '<h2>Participants</h2><div class="card"><table class="stbl"><thead><tr><th>Club</th><th>Players</th><th></th></tr></thead><tbody>'+rows.slice(0,nR).map(([c,n],i)=>'<tr class="tap'+(S.me&&S.me.c===c?' hi':'')+'" data-act="opencountry" data-cc="'+esc(c)+'"><td><span class="cn">'+rk[i]+'. <span class="flag" style="width:auto;font-size:15px">'+(flag(c)||'')+'</span>'+esc(cname(c))+'</span></td><td>'+n+'</td><td style="width:34%"><span class="pbar" style="width:'+Math.max(4,Math.round(100*n/top))+'%"></span></td></tr>').join('')+'</tbody></table>'+moreBtn('part',rows.length,10,'countries')+'<p class="tiny muted" style="margin:8px 0 0">'+fmtN(st.players.length)+' players from '+rows.length+' clubs'+(st.age?' in the '+ageLbl(st.age)+' events':'')+', counting everyone who has played at least one match.</p></div>';
}


/* ---------- draws (brackets) ---------- */
const DRAW_API='https://extranet-lv.bwfbadminton.com/api/';
const SECTION=16; // first-round slots per swipeable section
const DRAW_V=2; // bump when the compact draw format changes so old cached draws are ignored
async function loadDrawList(){ return D.drawList||[]; }
function ensureDrawList(){ // loads the draw list once, re-renders when it lands
  if(D.drawList||D.drawListBusy) return;
  D.drawListBusy=loadDrawList().then(()=>{ D.drawListBusy=null; render({bg:true}); }).catch(()=>{ D.drawListBusy=null; });
}
function drawFor(eventName){ return (D.drawList||[]).find(d=>d.name===eventName)||null; }
function drawUrl(id){ return CFG.site+'/sport/draw.aspx?id='+CFG.tid+'&draw='+encodeURIComponent(id); }
function compactDraw(res){
  const team=t=>(t&&t.players||[]).map(p=>({i:String(p.id), n:fixName(p.nameDisplay||''), c:p.countryCode||t.countryCode||''}));
  const isBye=t=>!!(t&&(t.linkName==='Bye'||t.teamName==='Bye'));
  const out=[]; const rounds={};
  const R=res&&res.results||{};
  for(const k in R){
    const m=R[k]&&R[k].match; if(!m) continue;
    const [c,r]=k.split('-').map(Number); if(isNaN(c)||isNaN(r)) continue;
    rounds[c]=m.roundName||rounds[c]||'';
    out.push({c,r,n:String(m.code||''),rd:m.roundName||'',t:(m.matchTime||'').slice(0,16),st:m.matchStatus||'N',w:+m.winner||0,a:team(m.team1),b:team(m.team2),ab:isBye(m.team1),bb:isBye(m.team2),sa:m.team1seed||'',sb:m.team2seed||'',sc:(m.score||[]).map(x=>[x.home,x.away]),ss:m.scoreStatusValue||'Normal'});
  }
  out.sort((x,y)=>x.c-y.c||x.r-y.r);
  const cols=out.length?Math.max(...out.map(m=>m.c))+1:0;
  const n0=out.filter(m=>m.c===0).length;
  return {m:out, cols, rounds, n0, v:DRAW_V};
}
async function loadDraw(id, force){ // brackets come with data.json
  if(force||!D.draws[id]){ D.days={}; await load({force:true}); }
  const d=D.draws[id]; if(!d) throw new Error('this draw has no bracket yet'); return d;
}
function isGroupDraw(dr){ return !!dr&&/liguilla|round robin|grupo/i.test((dr.type||'')+' '+dr.name); }
function groupHtml(dr, ctx){ // a group: the table worked out from its matches, then the matches
  const ms=allMatches().filter(m=>m.did===dr.id).sort((x,y)=>x.t<y.t?-1:x.t>y.t?1:0);
  if(!ms.length) return '<div class="card empty">No matches in this group yet.</div>';
  const T=new Map(), key=t=>t.map(p=>p.i).sort().join('+');
  const team=t=>{ const k=key(t); let e=T.get(k); if(!e){ e={k,t,pl:0,w:0,l:0,gw:0,gl:0,pw:0,pa:0}; T.set(k,e); } return e; };
  for(const m of ms){
    if(m.a.length) team(m.a); if(m.b.length) team(m.b);
    if(!m.a.length||!m.b.length||!(m.w===1||m.w===2)) continue;
    const A=team(m.a), B=team(m.b); A.pl++; B.pl++; (m.w===1?A:B).w++; (m.w===1?B:A).l++;
    for(const g of m.sc){ const x=+g[0]||0, y=+g[1]||0; A.pw+=x; A.pa+=y; B.pw+=y; B.pa+=x; if(x>y){ A.gw++; B.gl++; } else if(y>x){ B.gw++; A.gl++; } }
  }
  const rows=[...T.values()].sort((x,y)=>y.w-x.w||(y.gw-y.gl)-(x.gw-x.gl)||(y.pw-y.pa)-(x.pw-x.pa)||x.t[0].n.localeCompare(y.t[0].n));
  const hl=new Set([S.draw&&S.draw.pid, S.me&&S.me.i].filter(Boolean));
  const sg=n=>(n>0?'+':'')+n;
  let html='<div class="card"><table class="stbl"><thead><tr><th>Player</th><th>P</th><th>W–L</th><th>Games</th><th>Points</th></tr></thead><tbody>'+
    rows.map((e,i)=>'<tr class="tap'+(e.t.some(p=>hl.has(p.i))?' hi':'')+'" data-act="open" data-id="'+esc(e.t[0].i)+'"><td><span class="cn">'+(i+1)+'. '+e.t.map(p=>esc(p.n)).join(' / ')+'</span><div class="tiny muted">'+[...new Set(e.t.map(p=>cname(p.c)))].map(esc).join(' / ')+'</div></td><td>'+e.pl+'</td><td><b>'+e.w+'–'+e.l+'</b></td><td>'+e.gw+'–'+e.gl+'</td><td>'+sg(e.pw-e.pa)+'</td></tr>').join('')+
    '</tbody></table><p class="tiny muted" style="margin:8px 0 0">Ordered by wins, then games and points difference. The official order can use head-to-head; check the venue board.</p></div>';
  html+='<h2>Matches</h2><div class="stack">'+ms.map(m=>matchCard(m,ctx,{hl,markMine:true,noFade:true})).join('')+'</div>';
  return html;
}
function drawMatch(d,c,r){ return d.m.find(m=>m.c===c&&m.r===r); }
function playerInTeam(t,pid){ return t.some(p=>p.i===pid); }
function playerMatchesInDraw(d,pid){ return d.m.filter(m=>playerInTeam(m.a,pid)||playerInTeam(m.b,pid)); }
function playerPosition(d,pid){ // the highest-round match containing the player
  let best=null; for(const m of playerMatchesInDraw(d,pid)){ if(!best||m.c>best.c) best=m; }
  if(!best) return null; const side=playerInTeam(best.b,pid)?1:0; const won=best.w===side+1, lost=(best.w===1||best.w===2)&&!won;
  return {m:best, side, won, lost};

// sections: a big draw is split into swipeable parts of SECTION first-round slots each, plus a "Finals" part where they meet
function drawParts(d){
  if(!d||!d.cols) return [];
  const n0=d.n0!=null?d.n0:(d.m||[]).filter(m=>m.c===0).length; // tolerate a cached draw without n0
  if(n0<=SECTION) return [{key:'all', label:'Whole draw', c0:0, c1:d.cols-1, r0:0, n:n0}];
  const depth=Math.log2(SECTION); // columns inside a part: c0 .. c0+depth
  const parts=[]; const nParts=Math.ceil(n0/SECTION);
  for(let i=0;i<nParts;i++) parts.push({key:'p'+i, label:'Part '+(i+1), c0:0, c1:Math.min(depth,d.cols-1), r0:i*SECTION, n:SECTION});
  if(d.cols-1>depth) parts.push({key:'finals', label:'Finals', c0:depth, c1:d.cols-1, r0:0, n:n0/Math.pow(2,depth)});
  return parts;
}
function partOfMatch(d,parts,m){ // which part shows match m: its section, or Finals for rounds past the sections
  if(!m||parts.length===1) return parts[0];
  const depth=Math.log2(SECTION);
  const finals=parts[parts.length-1].key==='finals'?parts[parts.length-1]:null;
  if(finals&&m.c>depth) return finals;
  const firstRow=m.r*Math.pow(2,m.c);
  return parts[Math.min(Math.floor(firstRow/SECTION), parts.length-(finals?2:1))]||parts[0];
}
function bracketNames(t){ return t.map(p=>p.n.split(' ').pop()).join('/'); }
function bbox(m, d, ctx, pid){ // one match box in the bracket
  const live=m.n&&D.byCode.get(m.n); // live day record when the match is scheduled
  const st=live?live.st:m.st, sc=live?live.sc:m.sc, w=live?live.w:m.w, du=live?live.du:null;
  const a=live?live.a:m.a, b=live?live.b:m.b, sa=live?live.sa:m.sa, sb=live?live.sb:m.sb;
  const bye=m.ab||m.bb; const tbd=!(a.length||m.ab)||!(b.length||m.bb);
  const mine=pid&&(playerInTeam(a,pid)||playerInTeam(b,pid));
  let meta='';
  if(bye) meta='Bye';
  else if(st==='P') meta='<span class="lv"><span class="livedot"></span>Live'+(du?' '+du+"'":'')+'</span>';
  else if(st==='W') meta='<span class="wu">Warm-up</span>';
  else if(st==='O'||st==='F') meta=(live&&live.ss&&live.ss!=='Normal')?live.ss:'Finished';
  else if(live) meta=(live.d===ctx.td?'Today':dayLabel(live.d).slice(0,6))+' '+live.tm+(live.v?' · '+live.v+(live.court?' C'+live.court:''):'');
  else if(m.t) meta=dayLabel(m.t.slice(0,10)).slice(0,6)+' '+m.t.slice(11,16);

    const cc=t[0]?t[0].c:'';
    const me=pid&&playerInTeam(t,pid);
    const nm=isBye?'<span class="muted">Bye</span>':(t.length?esc(bracketNames(t)):'<span class="muted">TBD</span>');
    return '<div class="bteam'+(winner?' win':'')+(loser?' lose':'')+(me?' me':'')+'">'+(t.length?'<span class="bflag">'+flag(cc)+'</span>':'<span class="bflag"></span>')+'<span class="bn">'+nm+(seed?' <span class="seed">['+esc(seed)+']</span>':'')+'</span><span class="bs">'+sets.map(x=>'<span>'+x+'</span>').join('')+'</span></div>';
  };
  const s1=sc.map(x=>x[0]), s2=sc.map(x=>x[1]);

}
function viewDraw(ctx){
  ensureDrawList();

    else { html+='<div class="stack"><div class="skel"></div><div class="skel"></div></div>'; if(!D.drawBusy[S.draw.id]) loadDraw(S.draw.id).then(()=>render({bg:true})).catch(e=>{ S.drawErr=String(e&&e.message||e); render({bg:true}); }); }

  }
  if(!d.cols){ html+='<div class="card empty">This event is played in groups, not a knock-out draw. Group play is not shown here yet.</div>'; return html; }

  if(Date.now()-(d.at||0)>10*60000&&!D.drawBusy[S.draw.id]) loadDraw(S.draw.id).then(()=>render({bg:true})).catch(()=>{});
  const parts=drawParts(d);

  if(parts.length>1){
    html+='<div class="chips" style="padding-bottom:6px">'+parts.map(p=>{ const has=pos&&partOfMatch(d,parts,pos.m).key===p.key; return '<button class="chip'+(p.key===part.key?' on':'')+'" data-act="drawpart" data-part="'+p.key+'">'+esc(p.label)+(has?' <span class="n">you</span>':'')+'</button>'; }).join('')+'</div>';
  }
  // round chips for the columns in this part
  const cols=[]; for(let c=part.c0;c<=part.c1;c++) cols.push({c, rd:d.rounds[c]||('R'+(1<<(d.cols-c)))});
  html+='<div class="rchips"><div class="chips" id="rchips">'+cols.map((x,i)=>'<button class="chip rd'+(i===0?' on':'')+'" data-act="drawcol" data-i="'+i+'">'+esc(x.rd)+'</button>').join('')+'<span class="tiny muted" style="align-self:center;white-space:nowrap;padding-right:8px">swipe →</span></div></div>';
  // the tree: one column per round, equal total height so the connectors line up

    for(let k=0;k<count;k++){ const m=drawMatch(d,x.c,r0+k); html+='<div class="bslot">'+(m?bbox(m,d,ctx,pid):'<div class="bbox tbd"><div class="bmeta"></div><div class="bteam"><span class="bflag"></span><span class="bn muted">TBD</span></div><div class="bteam"><span class="bflag"></span><span class="bn muted">TBD</span></div></div>')+'</div>'; }
    html+='</div></div>';
  });
  html+='</div>';
  html+='<p class="tiny muted" style="margin-top:8px"><a href="'+drawUrl(S.draw.id)+'" target="_blank" rel="noopener">Open on badminton.es</a>. Swipe the bracket sideways to move through the rounds; lines show which matches feed the next one. '+(parts.length>1?'Big draws are split into parts of '+SECTION+' first-round places; the Finals part shows where the parts meet.':'')+'</p>';
  return html;
}
function afterDrawRender(){ // wire up swipe tracking and initial position; called after the view is in the DOM

/* ---------- usage counter, just for fun ---------- */
// Abacus is a free, anonymous hit counter (https://abacus.jasoncameron.dev). Three counters: page loads, distinct phones
// (first visit ever, remembered in localStorage) and phones per tournament day. Nothing personal is sent; it sees the same
// request any image on a page would. Not counted: local test runs, automated browsers and phones with <storage>:nocount set.
const CNT='https://abacus.jasoncameron.dev/', CNS=CFG.counter;
const U={devices:null, today:null, days:null, at:0};
function cntCall(kind,key){ return fetch(CNT+kind+'/'+CNS+'/'+key,{cache:'no-store',keepalive:true}).then(r=>r.ok?r.json():null).then(j=>(j&&typeof j.value==='number')?j.value:null).catch(()=>null); }
function track(){
  try{
    if(!/^https?:$/.test(location.protocol)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||navigator.webdriver||store.get('nocount')) return;
    const day=romeNow().slice(0,10);
    cntCall('hit','loads');
    const first=!store.get('counted'); if(first) store.set('counted',day);
    const newDay=store.get('countedday')!==day; if(newDay) store.set('countedday',day);
    Promise.all([
      first?cntCall('hit','devices').then(v=>{ if(v==null) store.del('counted'); return v; }):cntCall('get','devices'),
      newDay?cntCall('hit','day-'+day).then(v=>{ if(v==null) store.del('countedday'); return v; }):cntCall('get','day-'+day)
    ]).then(([d,t])=>{ U.devices=d; U.today=t; const el=document.getElementById('usage'); if(el) el.textContent=usageText(); });
  }catch(e){}
}
function usageText(){ if(U.devices==null) return ''; return 'Used on '+U.devices+' phone'+(U.devices===1?'':'s')+' so far'+(U.today!=null?', '+U.today+' today':'')+'.'; }
function viewUsage(){ // hidden page: #usage (was #stats before the Stats tab existed)
  let html='<h2>Usage</h2><p class="small muted">Counted per phone (first visit ever, and once per day). Page loads count every open of the site. Just for fun, not an official statistic.</p>';
  if(!U.days){ html+='<div class="stack"><div class="skel"></div></div>'; if(!U.busy){ U.busy=true; const keys=['loads','devices'].concat(CFG.days.map(d=>'day-'+d)); Promise.all(keys.map(k=>cntCall('get',k))).then(vs=>{ U.days={}; keys.forEach((k,i)=>U.days[k]=vs[i]); U.busy=false; U.at=Date.now(); render({bg:true}); }); } return html; }
  const v=k=>U.days[k]==null?'–':U.days[k];
  html+='<div class="card"><div class="row"><div class="grow"><div class="ev">Phones so far</div><div class="big cond" style="font-size:32px;font-weight:700;line-height:1.1">'+v('devices')+'</div></div><div class="grow"><div class="ev">Page loads</div><div class="big cond" style="font-size:32px;font-weight:700;line-height:1.1">'+v('loads')+'</div></div></div></div>';
  html+='<div class="card" style="margin-top:10px"><div class="ev" style="margin-bottom:6px">Phones per day</div>'+CFG.days.map(d=>'<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="grow">'+dayLabel(d)+'</span><b>'+v('day-'+d)+'</b></div>').join('')+'</div>';
  html+='<p class="small muted" style="margin-top:10px">Fetched '+fmtClock(U.at)+'. <button class="btn ghost" data-act="statsreload">Refresh</button></p>';
  return html;
}

/* ---------- boot ---------- */
document.title=CFG.name; { const t=document.getElementById('ttl'); if(t) t.textContent=CFG.name; const u=document.getElementById('sub'); if(u) u.textContent=CFG.subtitle; }
readHash();
bootFromCache();
resolvePending();
render();
load().then(()=>{ resolvePending(); render({bg:true}); });
// the days come from data.json, so a new tournament only needs config.json
fetch(CFG.data+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(!j) return; const ds=Object.keys(j.days||{}).sort(); if(ds.length&&ds.join()!==CFG.days.join()){ CFG.days=ds; load({force:true}).then(()=>render({bg:true})); } }).catch(()=>{});
track();
})();
</script>
